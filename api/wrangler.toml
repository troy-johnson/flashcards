name = "api-flashcards"
main = "src/index.ts"
compatibility_date = "2026-05-17"
compatibility_flags = ["nodejs_compat"]

[vars]
APP_ORIGIN = "http://localhost:5173"
DIAG_GUARDIAN_EMAIL = "local-guardian@example.com"
AUTH_EMAIL_ISSUER = "dev-log"
AUTH_ACCESS_MODE = "open"
# Placeholder sender identity. Replace with the Resend-verified address before
# flipping AUTH_EMAIL_ISSUER to "resend".
EMAIL_FROM = "Reader's Way <signin@example.com>"

[[d1_databases]]
binding = "DB"
database_name = "literacy_preview"
database_id = "e3884eb3-fb85-4b29-9940-9c241bbc67ef"

[env.preview]
name = "api-flashcards-preview"

[env.preview.vars]
APP_ORIGIN = "https://flashcards.troyjohnson.workers.dev"
DIAG_GUARDIAN_EMAIL = "pilot-guardian@example.com"
AUTH_EMAIL_ISSUER = "dev-log"
AUTH_ACCESS_MODE = "open"
# Placeholder sender identity. Replace with the Resend-verified address before
# flipping AUTH_EMAIL_ISSUER to "resend".
EMAIL_FROM = "Reader's Way <signin@example.com>"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "literacy_preview"
database_id = "e3884eb3-fb85-4b29-9940-9c241bbc67ef"

# Production env. Uses a dedicated D1 so preview migrations and test data cannot
# mutate pilot data.
[env.production]
name = "api-flashcards"

[env.production.vars]
APP_ORIGIN = "https://readersway.troyjohnson.dev"
AUTH_EMAIL_ISSUER = "resend"
AUTH_ACCESS_MODE = "allowlist"
# Resend-verified sender identity for production magic links.
EMAIL_FROM = "Reader's Way <readersway@troyjohnson.dev>"

[[env.production.d1_databases]]
binding = "DB"
database_name = "literacy_prod"
database_id = "e6b236d6-e3ae-4ff8-9a7e-4874c8419c96"

# Defense-in-depth for broad/public Resend access. The exact per-email cap remains
# D1-backed; this permissive per-location limiter constrains multi-address spray.
[[env.production.ratelimits]]
name = "AUTH_RATE_LIMITER"
namespace_id = "917403"

[env.production.ratelimits.simple]
limit = 10
period = 60
