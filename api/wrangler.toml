name = "api-flashcards"
main = "src/index.ts"
compatibility_date = "2026-05-17"
compatibility_flags = ["nodejs_compat"]

[vars]
APP_ORIGIN = "http://localhost:5173"
DIAG_GUARDIAN_EMAIL = "local-guardian@example.com"
AUTH_EMAIL_ISSUER = "dev-log"
# Placeholder sender identity. Replace with the Resend-verified address before
# flipping AUTH_EMAIL_ISSUER to "resend".
EMAIL_FROM = "Reader's Way <signin@example.com>"

[[d1_databases]]
binding = "DB"
database_name = "literacy_preview"
database_id = "e3884eb3-fb85-4b29-9940-9c241bbc67ef"

[env.preview]
name = "api-flashcards-preview"

[env.preview.vars]
APP_ORIGIN = "https://flashcards.troyjohnson.workers.dev"
DIAG_GUARDIAN_EMAIL = "pilot-guardian@example.com"
AUTH_EMAIL_ISSUER = "dev-log"
# Placeholder sender identity. Replace with the Resend-verified address before
# flipping AUTH_EMAIL_ISSUER to "resend".
EMAIL_FROM = "Reader's Way <signin@example.com>"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "literacy_preview"
database_id = "e3884eb3-fb85-4b29-9940-9c241bbc67ef"

# Production env. Single-DB strategy for v1: shares literacy_preview D1 until
# real users exist. Split into a literacy_prod D1 before launch.
[env.production]
name = "api-flashcards"

[env.production.vars]
APP_ORIGIN = "https://flashcards.troyjohnson.workers.dev"
DIAG_GUARDIAN_EMAIL = "pilot-guardian@example.com"
AUTH_EMAIL_ISSUER = "dev-log"
# Placeholder sender identity. Replace with the Resend-verified address before
# flipping AUTH_EMAIL_ISSUER to "resend".
EMAIL_FROM = "Reader's Way <signin@example.com>"

[[env.production.d1_databases]]
binding = "DB"
database_name = "literacy_preview"
database_id = "e3884eb3-fb85-4b29-9940-9c241bbc67ef"
