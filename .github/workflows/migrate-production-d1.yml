name: migrate production D1

on:
  workflow_dispatch:
    inputs:
      confirm_database:
        description: Type literacy_prod to confirm the target database
        required: true
        type: string
      reason:
        description: Change or incident reference for this migration
        required: true
        type: string

concurrency:
  group: production-d1-migration
  cancel-in-progress: false

jobs:
  migrate:
    environment: production-d1
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check external-pilot gate and typed confirmation
        env:
          EXTERNAL_GUARDIAN_PILOT: ${{ vars.EXTERNAL_GUARDIAN_PILOT }}
          CONFIRM_DATABASE: ${{ inputs.confirm_database }}
          MIGRATION_REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          if [[ "$EXTERNAL_GUARDIAN_PILOT" != "true" ]]; then
            echo "Production D1 migrations are disabled until EXTERNAL_GUARDIAN_PILOT=true." >&2
            exit 1
          fi
          if [[ "$CONFIRM_DATABASE" != "literacy_prod" ]]; then
            echo "Database confirmation must be exactly literacy_prod." >&2
            exit 1
          fi
          {
            echo "### Production D1 migration"
            echo
            printf 'Reason: %s\n' "$MIGRATION_REASON"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Verify production database identity
        run: |
          set -euo pipefail
          info_json="$(pnpm --filter api exec wrangler d1 info literacy_prod --env production --json)"
          jq -e --arg expected "e6b236d6-e3ae-4ff8-9a7e-4874c8419c96" '.uuid == $expected and .name == "literacy_prod"' <<< "$info_json"

      - name: Capture pre-migration bookmark
        run: |
          set -euo pipefail
          bookmark_json="$(pnpm --filter api exec wrangler d1 time-travel info literacy_prod --env production --json)"
          bookmark="$(jq -er '.bookmark' <<< "$bookmark_json")"
          {
            echo
            echo "Pre-migration Time Travel bookmark: \`$bookmark\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: List and apply pending migrations
        run: |
          set -euo pipefail
          pnpm --filter api exec wrangler d1 migrations list literacy_prod --env production --remote
          pnpm --filter api exec wrangler d1 migrations apply literacy_prod --env production --remote
          pnpm --filter api exec wrangler d1 migrations list literacy_prod --env production --remote

      - name: Verify migration ledger is readable
        run: |
          set -euo pipefail
          ledger_json="$(pnpm --filter api exec wrangler d1 execute literacy_prod --env production --remote --json --command "SELECT COUNT(*) AS migration_count FROM d1_migrations")"
          jq -e '.[0].success == true and .[0].results[0].migration_count >= 1' <<< "$ledger_json"
