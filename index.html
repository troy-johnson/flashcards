<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Heart Words Practice</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <header>
        <h1>Heart Words</h1>
        <p class="subtitle">Practice a word, then mark it off or flag it for more practice.</p>
      </header>

      <section class="controls" aria-label="Quarter filters">
        <h2>Include quarters</h2>
        <div class="quarter-options">
          <label><input type="checkbox" value="1" checked /> Q1</label>
          <label><input type="checkbox" value="2" checked /> Q2</label>
          <label><input type="checkbox" value="3" checked /> Q3</label>
          <label><input type="checkbox" value="4" checked /> Q4</label>
        </div>
      </section>

      <section class="card" aria-live="polite">
        <div class="word" id="wordDisplay">Press play to start</div>
        <div class="meta" id="wordMeta">Select a quarter and tap ▶</div>
      </section>

      <section class="actions" aria-label="Practice actions">
        <button class="action pass" id="passButton" type="button" aria-label="Passed">
          👍
          <span>Passed</span>
        </button>
        <button class="action practice" id="practiceButton" type="button" aria-label="Needs practice">
          👎
          <span>Practice</span>
        </button>
        <button class="action next" id="nextButton" type="button" aria-label="Next random word">
          ▶
          <span>Next</span>
        </button>
      </section>

      <section class="status">
        <div>
          <h2>Session progress</h2>
          <p><strong>Passed:</strong> <span id="passedCount">0</span></p>
          <p><strong>Needs practice:</strong> <span id="practiceCount">0</span></p>
        </div>
        <div class="lists">
          <div>
            <h3>Passed words</h3>
            <ul id="passedList"></ul>
          </div>
          <div>
            <h3>Practice words</h3>
            <ul id="practiceList"></ul>
          </div>
        </div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
